spring.datasource.url=jdbc:postgresql://localhost:5432/estoque_test_db
spring.datasource.username=estoque_app
spring.datasource.password=${ESTOQUE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Segredo fixo só para os testes. Em produção, o valor vem de ESTOQUE_JWT_SECRET.
estoque.jwt.segredo=segredo-de-teste-com-mais-de-32-caracteres
estoque.jwt.validade-horas=4