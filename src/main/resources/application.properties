spring.application.name=sistema-estoque-pedidos

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/estoque_db
spring.datasource.username=estoque_app
spring.datasource.password=${ESTOQUE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Autenticação JWT
estoque.jwt.segredo=${ESTOQUE_JWT_SECRET}
estoque.jwt.validade-horas=4

# Usuário inicial, criado só se a tabela usuarios estiver vazia
estoque.admin.usuario=${ESTOQUE_ADMIN_USUARIO:}
estoque.admin.senha=${ESTOQUE_ADMIN_SENHA:}